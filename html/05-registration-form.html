<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Student Registration Form | S. Hasmitha</title>
        <link rel="stylesheet" href="../assets/css/style.css">
    </head>
    <body>
        <header class="top">
            <div class="wrap">
                <h1>Student Registration Form</h1>
                <p>A basic HTML form using common form elements.</p>
                <nav>
                    <a href="../index.html">Home</a>
                    <a href="index.html">Back to HTML Programs</a>
                </nav>
            </div>
        </header>
        <main>
            <form onsubmit="event.preventDefault();document.getElementById('out').textContent='Registration submitted successfully!';">
                <label>Name<input required>
                </label>
                <label>Email<input type="email" required>
                </label>
                <label>Course<select>
                    <option>B.Tech</option>
                    <option>BCA</option>
                </select>
            </label>
            <button>Register</button>
        </form>
        <div id="out" class="result">
        </div>
    </main>
    <footer>S. Hasmitha · 250200430 · Section 5 · Web Technology and Internet Programming</footer>
</body>
